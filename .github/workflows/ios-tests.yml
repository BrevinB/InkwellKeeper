name: iOS Tests

on:
  pull_request:
    paths-ignore:
      - "Website/**"
      - "marketing/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "Website/**"
      - "marketing/**"
      - "**.md"

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator found"; xcrun simctl list devices; exit 1
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build and test
        run: |
          set -o pipefail
          # actool crashes distilling Icon Composer .icon bundles on CI VMs
          # (FB20183399, consistent on this runner) — tests don't need the
          # marketing icon, so skip it and blank the setting that requires it.
          xcodebuild test \
            -scheme "Inkwell Keeper" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            EXCLUDED_SOURCE_FILE_NAMES="ink.icon" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            | xcbeautify
