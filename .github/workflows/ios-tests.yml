name: iOS Tests

on:
  pull_request:
    paths-ignore:
      - "Website/**"
      - "marketing/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "Website/**"
      - "marketing/**"
      - "**.md"

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator found"; xcrun simctl list devices; exit 1
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build and test
        run: |
          set -o pipefail
          # Xcode 26.5+ actool randomly crashes distilling Icon Composer .icon
          # bundles on CI VMs (FB20183399). Retry only that failure; real build
          # or test failures exit immediately.
          for attempt in 1 2 3 4; do
            xcodebuild test \
              -scheme "Inkwell Keeper" \
              -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee xcodebuild.log | xcbeautify && exit 0
            if ! grep -q "Distill failed" xcodebuild.log; then
              exit 1
            fi
            echo "actool distill bug (FB20183399) — retrying ($attempt/4)"
          done
          exit 1
